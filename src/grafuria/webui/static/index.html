<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grafuria</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main id="layout">
    <section id="stage">
      <div id="cy" aria-label="Graph"></div>
      <div id="banner" hidden></div>
    </section>

    <aside id="panel">
      <h1>Grafuria</h1>

      <label class="field">Graph
        <select id="graph-select"><option value="">choose…</option></select>
      </label>
      <label class="field">Script
        <select id="script-select"><option value="">choose…</option></select>
      </label>

      <div class="buttons">
        <button id="play" title="Play / resume">&#9654; Play</button>
        <button id="pause" title="Pause">&#10074;&#10074; Pause</button>
        <button id="stop" title="Stop">&#9632; Stop</button>
        <button id="clear" title="Clear states">&#8635; Clear</button>
      </div>

      <label class="field">Speed <span id="speed-value">10</span>
        <input id="speed" type="range" min="1" max="10" value="10">
      </label>
      <label class="check"><input id="show-weight" type="checkbox"> Show weight</label>
      <label class="field">Log symbols
        <input id="log-symbols" type="text" value="#$" spellcheck="false">
      </label>

      <div id="status" role="status">Choose a graph and a script.</div>

      <h2>Parameters</h2>
      <dl id="params"><dt>—</dt></dl>
    </aside>

    <section id="log" aria-label="Log"></section>
  </main>

  <script src="/static/vendor/cytoscape.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
