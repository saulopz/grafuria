# Codeberg hosted runner (public, free/libre projects; fair use).
# See https://codeberg.org/actions/meta
name: tests

on:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: codeberg-small
    container:
      image: debian:trixie
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates python3 python3-venv python3-tk xvfb xauth

      # Plain git instead of actions/checkout: the Debian image has no
      # Node.js, which JavaScript actions need.
      - name: Checkout
        run: |
          git clone --depth 20 "${{ github.server_url }}/${{ github.repository }}.git" .
          git checkout "${{ github.sha }}"

      - name: Run tests
        run: sh ci/run-tests.sh
